name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          i=0
          for u in "https://www.ashesh.com.np/nepali-calendar/" \
                   "https://nepalicalendar.rat32.com/index.php?year=2083&month=7" \
                   "https://www.nepalipatro.com.np/nepali-calendar/2083/7" \
                   "https://nepcal.com/" \
                   "https://www.hamro-patro.com/" \
                   "https://moha.gov.np/notice" \
                   "https://english.ratopati.com/story/51491/public-holidays-to-be-declared-in-2083-bs-see-list" \
                   "https://www.nepalicalendar.com/" ; do
            i=$((i+1)); code=$(curl -sSL -m 30 -A "$UA" "$u" -o p$i.html -w "%{http_code}"); echo "$i $code $(wc -c < p$i.html) $u" >> codes.txt
          done
          git init -q -b probe && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
