name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          get() { curl -sSL -m 60 -A "$UA" "$1" -o "$2" -w "%{http_code} $1\n" >> codes.txt || echo "ERR $1" >> codes.txt; }
          get "https://moha.gov.np/page/government-and-public-holidays-in-2083" moha2083.html
          get "https://moha.gov.np/page/holidays" mohahol.html
          grep -oE 'https?://[^"'"'"' ]+\.(pdf|jpg|jpeg|png)' moha2083.html mohahol.html | cut -d: -f2- | sort -u > links.txt || true
          i=0; for u in $(grep -iE 'upload|storage|media' links.txt | head -12); do i=$((i+1)); ext="${u##*.}"; get "$u" "m$i.$ext"; done
          get "https://english.bankingsansar.com/news/27343" bs.html
          git init -q -b probe && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
