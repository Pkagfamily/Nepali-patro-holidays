name: Update holiday list
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [base.json, scripts/**]
permissions:
  contents: write
concurrency: robot-save
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check calendar for newly declared holidays
        run: python3 scripts/update.py
      - name: Weekly heartbeat (keeps the schedule active)
        run: date -u +%G-W%V > checked.txt
      - name: Save changes (retries if another job saves at the same time)
        run: scripts/save.sh holidays.json checked.txt status.txt
